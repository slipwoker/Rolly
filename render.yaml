# Render Blueprint: the Rolly web app in the existing "Rolly" project.
# Secrets are never stored here: OPENAI_API_KEY is entered in the Render dashboard, tokens are generated by Render,
# and the GPU backend variables (ROLLY_GPU_*) are set on the service when a GPU host exists.
projects:
  - name: Rolly
    environments:
      - name: Production
        services:
          - type: web
            name: rolly-voice
            runtime: docker
            dockerfilePath: ./Dockerfile.render
            dockerContext: .
            plan: standard
            region: frankfurt
            branch: claude/adoring-goodall-es5zzm
            healthCheckPath: /healthz
            autoDeploy: true
            buildFilter:   # documentation and result files do not restart the app (a deploy drops live conversations)
              ignoredPaths:
                - "**/*.md"
                - "docs/**"
                - "benchmarks/results/**"
                - "reports/**"
                - "tests/**"
            disk:
              name: rolly-data
              mountPath: /var/data
              sizeGB: 1
            envVars:
              - key: OPENAI_API_KEY
                sync: false
              - key: ROLLY_ACCESS_TOKEN
                generateValue: true
              - key: ROLLY_ADMIN_TOKEN
                generateValue: true
              - key: ROLLY_BLIND_SALT
                generateValue: true
              - key: ROLLY_UTILITY_LLM_BASE_URL
                value: https://api.openai.com/v1
              - key: ROLLY_UTILITY_LLM_MODEL
                value: gpt-6-luna
              - key: ROLLY_UTILITY_LLM_KEY_ENV
                value: OPENAI_API_KEY
              - key: ROLLY_UTILITY_LLM_TOKEN_PARAM
                value: max_completion_tokens
              - key: ROLLY_UTILITY_LLM_REASONING
                value: none
              - key: ROLLY_TRANSCRIPT_RETENTION_DAYS
                value: "30"
