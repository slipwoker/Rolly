# Named provider configurations.  `${VAR:-default}` is expanded from the environment.
# No credential is ever stored here: keys are read from the environment variable named in *_key_env.
#
# architecture: commercial | modular | speech_to_speech | hybrid | mock

providers:

  # ---------------------------------------------------------------- test plumbing only
  mock:
    type: mock
    architecture: mock
    test_only: true
    description: Deterministic tone generator used to test transport, telemetry and barge-in. Never benchmarked.

  # ---------------------------------------------------------------- Architecture B: self-hosted modular
  modular-selfhosted:
    type: modular
    architecture: modular
    description: Silero VAD -> faster-whisper -> open-weight LLM (OpenAI-compatible server) -> self-hosted TTS
    requires_files: ["${ROLLY_VAD_MODEL:-models/silero_vad.onnx}"]
    vad_model: "${ROLLY_VAD_MODEL:-models/silero_vad.onnx}"
    max_history_turns: ${ROLLY_MAX_HISTORY_TURNS:-24}
    tts_merge_chars: ${ROLLY_TTS_MERGE_CHARS:-70}   # after the first piece, short sentences are spoken together up to this many characters (0 = one piece per sentence; 70 since 2026-11-26, P1-D37)
    pronounce_url: "${ROLLY_PRON_URL:-}"   # the voice server's front end for names (infrastructure/blue_serve.py, port 1921); empty = off
    pronounce_cache: "${ROLLY_PRON_CACHE:-}"
    level_gate_db: ${ROLLY_LEVEL_GATE_DB:-0}   # ignore voices this many dB quieter than the user's own (0 = off)
    vad:
      endpoint_silence_ms: ${ROLLY_ENDPOINT_SILENCE_MS:-544}
      eager_silence_ms: ${ROLLY_EAGER_SILENCE_MS:-256}
      bargein_margin_db: ${ROLLY_BARGEIN_MARGIN_DB:-10}   # how close to the user's own loudness a sound must be to interrupt (0 = off)
      bargein_floor_db: ${ROLLY_BARGEIN_FLOOR_DB:--38}
    # One Whisper per language (measured: the Hebrew-tuned model is poor on English and vice versa).
    stt:
      default: he            # mixed / unknown language: detect Hebrew vs English, then route
      detect_with: en
      he:
        engine: faster_whisper
        model: "${ROLLY_STT_MODEL_HE:-ivrit-ai/whisper-large-v3-turbo-ct2}"
        device: "${ROLLY_STT_DEVICE:-auto}"
        compute_type: "${ROLLY_STT_COMPUTE:-default}"
        num_workers: ${ROLLY_STT_WORKERS:-1}
        cpu_threads: ${ROLLY_STT_CPU_THREADS:-0}
      en:
        engine: faster_whisper
        model: "${ROLLY_STT_MODEL_EN:-deepdml/faster-whisper-large-v3-turbo-ct2}"
        device: "${ROLLY_STT_DEVICE:-auto}"
        compute_type: "${ROLLY_STT_COMPUTE:-default}"
        num_workers: ${ROLLY_STT_WORKERS:-1}
        cpu_threads: ${ROLLY_STT_CPU_THREADS:-0}
    llm:
      base_url: "${ROLLY_LLM_BASE_URL:-http://127.0.0.1:8081/v1}"
      model: "${ROLLY_LLM_MODEL:-local}"
      api_key_env: ROLLY_LLM_API_KEY
      max_tokens: 120
      temperature: 0.6
    tts:
      default: en
      # English voice (ROLLY_TTS_EN_ENGINE):
      #   blue    BlueV3, through the same voice server as the Hebrew voice, in the voice the owner chose for English (P1-D36)
      #   sherpa  Kokoro or Piper through sherpa-onnx (the default here; the GPU pod switches to blue in start_worker.sh)
      en:
        engine: "${ROLLY_TTS_EN_ENGINE:-sherpa}"
        blue_url: "${ROLLY_BLUE_URL:-http://127.0.0.1:1920/v1}"
        blue_voice: "${ROLLY_BLUE_VOICE_EN:-jonathan}"   # the owner's pick for English, 2026-11-26
        blue_speed: ${ROLLY_BLUE_SPEED_EN:-1.0}
        blue_stream: "${ROLLY_BLUE_STREAM:-0}"
        blue_trim: "${ROLLY_BLUE_TRIM:-0}"
        blue_gap_ms: ${ROLLY_BLUE_GAP_MS:-150}
        blue_pause_cap_ms: ${ROLLY_BLUE_PAUSE_CAP_MS:-0}   # >0: no silence longer than this many ms inside a piece (off: not preferred in blind listening)
        blue_language: en
        kind: "${ROLLY_TTS_EN_KIND:-kokoro}"
        model_dir: "${ROLLY_TTS_EN_DIR:-models/kokoro-multi-lang-v1_0}"
        model_file: "${ROLLY_TTS_EN_FILE:-}"
        speaker_id: ${ROLLY_TTS_EN_SPEAKER:-3}
        num_threads: ${ROLLY_TTS_THREADS:-2}
        num_instances: ${ROLLY_TTS_INSTANCES:-1}
        provider: "${ROLLY_TTS_PROVIDER:-cpu}"
        # when the voice server fails before it starts to speak, the reply is still spoken (Piper, as before P1-D36)
        fallback:
          engine: sherpa
          kind: vits
          model_dir: models/vits-piper-en_US-lessac-medium
          model_file: en_US-lessac-medium.onnx
          speaker_id: 0
          num_threads: ${ROLLY_TTS_THREADS:-2}
          num_instances: ${ROLLY_TTS_INSTANCES:-1}
          provider: "${ROLLY_TTS_PROVIDER:-cpu}"
      # Hebrew voice (ROLLY_TTS_HE_ENGINE):
      #   blue          BlueV3, built-in voice, served by infrastructure/blue_setup.sh - chosen from listening samples
      #   zonos         ZONOS3-Mini with a cloned voice (infrastructure/zonos_setup.sh) - withdrawn: cut sentence endings
      #   renikud_piper small open voice on CPU - judged robotic and accented; also the fallback when a server is down
      he:
        engine: "${ROLLY_TTS_HE_ENGINE:-renikud_piper}"
        blue_url: "${ROLLY_BLUE_URL:-http://127.0.0.1:1920/v1}"
        blue_voice: "${ROLLY_BLUE_VOICE:-ariel}"   # chosen by the owner from 77 listening samples, 2026-11-26 (before: daniel)
        blue_speed: ${ROLLY_BLUE_SPEED:-1.0}          # 1.0 = natural read-speech pace of the voice (before: 1.2)
        blue_stream: "${ROLLY_BLUE_STREAM:-0}"         # 0 = a piece is synthesised as a whole, not sentence by sentence
        blue_trim: "${ROLLY_BLUE_TRIM:-0}"             # 1 = cut the silence each piece starts and ends with, fixed gap after it
        blue_gap_ms: ${ROLLY_BLUE_GAP_MS:-150}
        blue_pause_cap_ms: ${ROLLY_BLUE_PAUSE_CAP_MS:-0}   # >0: no silence longer than this many ms inside a piece (off: not preferred in blind listening)
        base_url: "${ROLLY_ZONOS_URL:-http://127.0.0.1:1919}"
        reference_codes: "${ROLLY_ZONOS_VOICE:-/workspace/voices/he_voice.codes.npy}"
        reference_frames: ${ROLLY_ZONOS_REFERENCE_FRAMES:-0}
        speaking_rate: ${ROLLY_ZONOS_SPEAKING_RATE:-24}   # UTF-8 bytes per second; 24 measured at about 14.5 characters per second
        model_dir: "${ROLLY_TTS_HE_DIR:-models/hebrew-tts}"
        length_scale: ${ROLLY_TTS_HE_LENGTH_SCALE:-0.85}   # below 1 = faster speech
        num_threads: ${ROLLY_TTS_THREADS:-2}
        num_instances: ${ROLLY_TTS_INSTANCES:-1}
        provider: "${ROLLY_TTS_PROVIDER:-cpu}"
        fallback:
          engine: renikud_piper
          model_dir: "${ROLLY_TTS_HE_DIR:-models/hebrew-tts}"
          length_scale: ${ROLLY_TTS_HE_LENGTH_SCALE:-0.85}
          num_threads: ${ROLLY_TTS_THREADS:-2}
          num_instances: ${ROLLY_TTS_INSTANCES:-1}
          provider: "${ROLLY_TTS_PROVIDER:-cpu}"

  # ---------------------------------------------------------------- Architecture D: hybrid
  hybrid-apillm:
    type: modular
    architecture: hybrid
    description: Self-hosted VAD + STT + TTS with a low-cost commercial LLM over an OpenAI-compatible API
    requires_env: [ROLLY_HYBRID_LLM_BASE_URL]
    vad_model: "${ROLLY_VAD_MODEL:-models/silero_vad.onnx}"
    max_history_turns: ${ROLLY_MAX_HISTORY_TURNS:-24}
    level_gate_db: ${ROLLY_LEVEL_GATE_DB:-0}   # ignore voices this many dB quieter than the user's own (0 = off)
    vad:
      endpoint_silence_ms: ${ROLLY_ENDPOINT_SILENCE_MS:-544}
      eager_silence_ms: ${ROLLY_EAGER_SILENCE_MS:-256}
      bargein_margin_db: ${ROLLY_BARGEIN_MARGIN_DB:-10}   # how close to the user's own loudness a sound must be to interrupt (0 = off)
      bargein_floor_db: ${ROLLY_BARGEIN_FLOOR_DB:--38}
    # One Whisper per language (measured: the Hebrew-tuned model is poor on English and vice versa).
    stt:
      default: he            # mixed / unknown language: detect Hebrew vs English, then route
      detect_with: en
      he:
        engine: faster_whisper
        model: "${ROLLY_STT_MODEL_HE:-ivrit-ai/whisper-large-v3-turbo-ct2}"
        device: "${ROLLY_STT_DEVICE:-auto}"
        compute_type: "${ROLLY_STT_COMPUTE:-default}"
        num_workers: ${ROLLY_STT_WORKERS:-1}
        cpu_threads: ${ROLLY_STT_CPU_THREADS:-0}
      en:
        engine: faster_whisper
        model: "${ROLLY_STT_MODEL_EN:-deepdml/faster-whisper-large-v3-turbo-ct2}"
        device: "${ROLLY_STT_DEVICE:-auto}"
        compute_type: "${ROLLY_STT_COMPUTE:-default}"
        num_workers: ${ROLLY_STT_WORKERS:-1}
        cpu_threads: ${ROLLY_STT_CPU_THREADS:-0}
    llm:
      base_url: "${ROLLY_HYBRID_LLM_BASE_URL:-}"
      model: "${ROLLY_HYBRID_LLM_MODEL:-}"
      api_key_env: ROLLY_HYBRID_LLM_API_KEY
      max_tokens: 120
      token_param: "${ROLLY_HYBRID_LLM_TOKEN_PARAM:-max_tokens}"      # OpenAI's current models need max_completion_tokens
      reasoning_effort: "${ROLLY_HYBRID_LLM_REASONING:-}"            # e.g. "none": reasoning adds seconds to the first token
      omit_temperature: "${ROLLY_HYBRID_LLM_OMIT_TEMPERATURE:-}"
    tts:
      default: en
      en:
        engine: sherpa
        kind: "${ROLLY_TTS_EN_KIND:-kokoro}"
        model_dir: "${ROLLY_TTS_EN_DIR:-models/kokoro-multi-lang-v1_0}"
        model_file: "${ROLLY_TTS_EN_FILE:-}"
        speaker_id: ${ROLLY_TTS_EN_SPEAKER:-3}
        num_threads: ${ROLLY_TTS_THREADS:-2}
      he:
        engine: renikud_piper
        model_dir: "${ROLLY_TTS_HE_DIR:-models/hebrew-tts}"
        length_scale: ${ROLLY_TTS_HE_LENGTH_SCALE:-0.85}   # below 1 = faster speech
        num_threads: ${ROLLY_TTS_THREADS:-2}

  # ---------------------------------------------------------------- Architecture A: commercial realtime
  openai-realtime:
    type: openai_realtime
    architecture: commercial
    description: OpenAI Realtime API (speech-to-speech), server-side WebSocket bridge
    requires_env: [OPENAI_API_KEY]
    model: "${ROLLY_OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}"
    voice: "${ROLLY_OPENAI_REALTIME_VOICE:-marin}"
    api_key_env: OPENAI_API_KEY
    turn_detection: "${ROLLY_OPENAI_TURN_DETECTION:-semantic_vad}"
    transcription_model: "${ROLLY_OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}"
    url: "${ROLLY_OPENAI_REALTIME_URL:-}"

  openai-realtime-mini:
    type: openai_realtime
    architecture: commercial
    description: OpenAI Realtime API, mini model (cost variant of the baseline)
    requires_env: [OPENAI_API_KEY]
    model: "${ROLLY_OPENAI_REALTIME_MINI_MODEL:-gpt-realtime-2.1-mini}"
    voice: "${ROLLY_OPENAI_REALTIME_VOICE:-marin}"
    api_key_env: OPENAI_API_KEY
    turn_detection: "${ROLLY_OPENAI_TURN_DETECTION:-semantic_vad}"
    transcription_model: "${ROLLY_OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}"

  # Variants of the baseline with OpenAI's faster turn detection (for a fair latency comparison)
  openai-realtime-servervad:
    type: openai_realtime
    architecture: commercial
    description: OpenAI Realtime API with silence-based server VAD (500 ms)
    requires_env: [OPENAI_API_KEY]
    model: "${ROLLY_OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}"
    voice: "${ROLLY_OPENAI_REALTIME_VOICE:-marin}"
    api_key_env: OPENAI_API_KEY
    turn_detection: server_vad
    silence_duration_ms: 500
    transcription_model: "${ROLLY_OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}"

  openai-realtime-eager:
    type: openai_realtime
    architecture: commercial
    description: OpenAI Realtime API with semantic VAD, eagerness high
    requires_env: [OPENAI_API_KEY]
    model: "${ROLLY_OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}"
    voice: "${ROLLY_OPENAI_REALTIME_VOICE:-marin}"
    api_key_env: OPENAI_API_KEY
    turn_detection: semantic_vad
    eagerness: high
    transcription_model: "${ROLLY_OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}"

  gemini-live:
    type: gemini_live
    architecture: commercial
    description: Google Gemini Live API (native audio), server-side WebSocket bridge
    requires_env: [GEMINI_API_KEY]
    model: "${ROLLY_GEMINI_LIVE_MODEL:-gemini-3.8-live}"
    voice: "${ROLLY_GEMINI_LIVE_VOICE:-Zephyr}"
    url: "${ROLLY_GEMINI_LIVE_URL:-}"
    api_key_env: GEMINI_API_KEY
