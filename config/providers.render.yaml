# Provider set for the hosted deployment (Render web app + optional RunPod GPU backend).
# The app tier holds no large models.  The self-hosted agent runs entirely on the GPU host and is
# relayed from here; when the GPU is switched off, `selfhosted-gpu` shows as unavailable and the two
# OpenAI-backed agents keep working.
#
#   ROLLY_GPU_WORKER_URL   e.g. https://<pod-id>-8000.proxy.runpod.net/v1   (backend/gpu_worker.py)
#   ROLLY_GPU_HEALTH_URL   e.g. https://<pod-id>-8000.proxy.runpod.net/healthz
#   ROLLY_GPU_API_KEY      bearer token shared with the GPU host
#   OPENAI_API_KEY

providers:

  mock:
    type: mock
    architecture: mock
    test_only: true
    description: Deterministic tone generator for plumbing tests. Never benchmarked.

  # Architecture B: everything self-hosted on the GPU host.  The complete pipeline (turn detection,
  # Whisper, Gemma on vLLM, voices) runs there and this app relays audio over one WebSocket, so a turn
  # pays the network once.  (Calling the three models separately from here cost about 200-300 ms each.)
  selfhosted-gpu:
    type: remote
    architecture: modular
    description: Complete self-hosted pipeline on the rented GPU host (Whisper per language + Gemma-4 26B on vLLM + Piper voices); this app relays audio
    requires_env: [ROLLY_GPU_WORKER_URL]
    requires_health: ["${ROLLY_GPU_HEALTH_URL:-}"]
    url: "${ROLLY_GPU_WORKER_URL:-}"
    api_key_env: ROLLY_GPU_API_KEY

  # Architecture A: commercial speech-to-speech (fastest of the measured turn-detection modes)
  openai-realtime:
    type: openai_realtime
    architecture: commercial
    description: OpenAI Realtime API, server VAD 500 ms, server-side WebSocket bridge
    requires_env: [OPENAI_API_KEY]
    model: "${ROLLY_OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}"
    voice: "${ROLLY_OPENAI_REALTIME_VOICE:-marin}"
    api_key_env: OPENAI_API_KEY
    turn_detection: server_vad
    silence_duration_ms: 500
    transcription_model: "${ROLLY_OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}"

  # Architecture D: works without any GPU - commercial transcription and language model, open voices on this app's CPU
  hybrid-api:
    type: modular
    architecture: hybrid
    description: OpenAI transcription + gpt-6-luna (reasoning off) + open Hebrew/English voices on the app's CPU
    requires_env: [OPENAI_API_KEY]
    requires_files: ["${ROLLY_VAD_MODEL:-models/silero_vad.onnx}", "models/hebrew-tts/he_IL-noa-medium.onnx"]
    vad_model: "${ROLLY_VAD_MODEL:-models/silero_vad.onnx}"
    max_history_turns: ${ROLLY_MAX_HISTORY_TURNS:-24}
    level_gate_db: ${ROLLY_LEVEL_GATE_DB:-0}   # ignore voices this many dB quieter than the user's own (0 = off)
    vad:
      endpoint_silence_ms: ${ROLLY_ENDPOINT_SILENCE_MS:-544}
      eager_silence_ms: ${ROLLY_EAGER_SILENCE_MS:-256}
      bargein_margin_db: ${ROLLY_BARGEIN_MARGIN_DB:-10}   # how close to the user's own loudness a sound must be to interrupt (0 = off)
      bargein_floor_db: ${ROLLY_BARGEIN_FLOOR_DB:--38}
    stt:
      engine: openai_compat
      base_url: https://api.openai.com/v1
      model: "${ROLLY_OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}"
      api_key_env: OPENAI_API_KEY
    llm:
      base_url: https://api.openai.com/v1
      model: "${ROLLY_HYBRID_LLM_MODEL:-gpt-6-luna}"
      api_key_env: OPENAI_API_KEY
      max_tokens: 120
      token_param: max_completion_tokens
      reasoning_effort: none
    tts:
      default: en
      en:
        engine: sherpa
        kind: vits
        model_dir: models/vits-piper-en_US-lessac-medium
        model_file: en_US-lessac-medium.onnx
        speaker_id: 0
        num_threads: 1
        num_instances: 2
      # Hebrew voice.  An OpenAI voice (gpt-4o-mini-tts) was tried here on 2026-11-25 as a listening reference and
      # withdrawn the same day: it spoke Hebrew at 8-12 characters per second ("word by word" to the listener), its
      # speed could not be raised, and it took 0.65-1.3 s to start.  ROLLY_HYBRID_HE_VOICE_ENGINE=openai_compat restores it.
      he:
        engine: "${ROLLY_HYBRID_HE_VOICE_ENGINE:-renikud_piper}"
        length_scale: ${ROLLY_TTS_HE_LENGTH_SCALE:-0.85}   # below 1 = faster; 0.85 measured at about 12.5 characters per second
        base_url: https://api.openai.com/v1
        api_key_env: OPENAI_API_KEY
        model: "${ROLLY_OPENAI_TTS_MODEL:-gpt-4o-mini-tts}"
        voice: "${ROLLY_OPENAI_TTS_VOICE:-marin}"
        sample_rate: 24000
        model_dir: models/hebrew-tts
        num_threads: 1
        num_instances: 2
