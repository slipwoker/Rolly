# Single-GPU benchmark stack (L40S 48 GB class): vLLM for the LLM + the application with CUDA STT/TTS.
# NOT executed in this POC session (no GPU) - written from vendor documentation; expect to adjust flags.
#   docker compose -f infrastructure/docker-compose.gpu.yml up --build
services:
  llm:
    image: vllm/vllm-openai:latest
    command: ["--model", "${ROLLY_VLLM_MODEL:-google/gemma-4-26B-A4B-it}", "--served-model-name", "local",
              "--max-model-len", "16384", "--gpu-memory-utilization", "0.70", "--enable-prefix-caching"]
    environment: ["HF_TOKEN=${HF_TOKEN:-}"]
    volumes: ["../models/hf:/root/.cache/huggingface"]
    ipc: host
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    ports: ["127.0.0.1:8081:8000"]
  app:
    build: {context: .., dockerfile: infrastructure/Dockerfile.gpu}
    env_file: [../.env]
    environment:
      ROLLY_LLM_BASE_URL: http://llm:8000/v1
      ROLLY_LLM_MODEL: local
      ROLLY_STT_MODEL: ivrit-ai/whisper-large-v3-turbo-ct2
      ROLLY_STT_DEVICE: cuda
      ROLLY_STT_COMPUTE: float16
      ROLLY_STT_WORKERS: "4"
      ROLLY_TTS_PROVIDER: cuda
      ROLLY_TTS_INSTANCES: "4"
      ROLLY_WARM_PROVIDERS: modular-selfhosted
    volumes: ["../models:/app/models", "../data:/app/data"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    ports: ["8000:8000"]
    depends_on: [llm]
