# Local CPU stack: test platform + llama.cpp LLM server.
#   infrastructure/download_models.sh && docker compose up --build   ->  http://localhost:8000
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/${ROLLY_GGUF:-qwen3-4b-instruct-q4_k_m.gguf}", "--host", "0.0.0.0", "--port", "8081", "-c", "8192", "-np", "2", "--jinja"]
    volumes: ["./models/gguf:/models:ro"]   # copy or symlink the .gguf here (download_models.sh prints its location)
    ports: ["127.0.0.1:8081:8081"]
  app:
    build: .
    env_file: [.env]
    environment:
      ROLLY_LLM_BASE_URL: http://llm:8081/v1
      ROLLY_STT_DEVICE: cpu
      ROLLY_STT_COMPUTE: int8
    volumes: ["./models:/app/models:ro", "./data:/app/data"]
    ports: ["127.0.0.1:8000:8000"]   # bind to localhost; put TLS + ROLLY_ACCESS_TOKEN in front before exposing it
    depends_on: [llm]
