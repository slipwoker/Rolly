# Render Blueprint for ROLLY Phase 1: rolly-api (Node/TypeScript) and its PostgreSQL, in the existing "Rolly" project.
# Created by hand on 2026-11-25 and adopted by this Blueprint (existingResources: adopt), so the settings below match
# what exists. Secrets are never stored here: sync:false values are set in the Render dashboard.
projects:
  - name: Rolly
    environments:
      - name: Production
        services:
          - type: web
            name: rolly-api
            runtime: node
            plan: starter
            region: frankfurt
            branch: main
            buildCommand: npm ci
            startCommand: npm start -w @rolly/api
            healthCheckPath: /healthz
            autoDeploy: true
            buildFilter:   # only the API and what it imports restart it (a deploy drops live conversations)
              paths:
                - "apps/api/**"
                - "packages/contracts/**"
                - "package.json"
                - "package-lock.json"
                - "render.api.yaml"
              ignoredPaths:
                - "**/*.md"
                - "apps/api/test/**"
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: "22"
              - key: ROLLY_GPU_WORKER_URL
                value: https://gn48mxl9lsf1nv-8000.proxy.runpod.net/v1
              - key: ROLLY_UTILITY_LLM_MODEL
                value: gpt-6-luna
              - key: ROLLY_UTILITY_LLM_REASONING
                value: none
              - key: ROLLY_TIMEZONE
                value: Asia/Jerusalem
              - key: ROLLY_TRANSCRIPT_RETENTION_DAYS
                value: "30"
              - key: DATABASE_URL
                fromDatabase:
                  name: rolly-api-db
                  property: connectionString
              - key: ROLLY_GPU_API_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: ROLLY_ADMIN_TOKEN
                sync: false
              - key: ROLLY_ENROLLMENT_KEY
                sync: false
        databases:
          - name: rolly-api-db
            plan: basic-256mb
            region: frankfurt
            postgresMajorVersion: "17"
            diskSizeGB: 1
            databaseName: rolly_api_db
            user: rolly_api_db_user
            ipAllowList: []   # no access from outside Render
