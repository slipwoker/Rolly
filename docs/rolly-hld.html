<style>
:root{--bg:#f6f7f9;--fg:#1b2230;--mut:#5d6778;--line:#9aa4b5;--card:#ffffff;--c-client:#e6f0ff;--c-render:#e8f6ee;--c-gpu:#fff0e0;--c-ext:#f1e9fb;--acc:#0b6bcb;--grp:#eef0f4}

body{background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1040px;margin:auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.scroll{overflow-x:auto}
svg{display:block;min-width:760px;width:100%;height:auto;color:var(--fg)}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.t{font-size:13px;font-weight:600}.s{font-size:11px;fill:var(--mut)}.g{font-size:12px;font-weight:700;letter-spacing:.06em;fill:var(--mut)}
.box{stroke:var(--line);stroke-width:1.2}
.grp{fill:var(--grp);stroke:var(--line);stroke-dasharray:5 4}
.ar{stroke:var(--fg);stroke-width:1.5;fill:none}
.al{font-size:11px;fill:var(--acc);font-weight:600}
figcaption{color:var(--mut);margin-top:12px;font-size:.9rem}
</style>
